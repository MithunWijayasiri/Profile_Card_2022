<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile Card - Mithun</title>
    <script src="assets/data.js"></script>
    <script src="assets/script.js"></script>
    <script>
        // Add favicon links dynamically
        document.head.insertAdjacentHTML('beforeend', `
            <link rel="icon" type="image/png" sizes="16x16" href="${profileData.favicon.small}">
            <link rel="icon" type="image/png" sizes="32x32" href="${profileData.favicon.default}">
            <link rel="icon" type="image/png" sizes="96x96" href="${profileData.favicon.large}">
        `);
    </script>
    <link rel="preconnect" href="https://api.fonts.coollabs.io" crossorigin />
    <link href="https://api.fonts.coollabs.io/css2?family=Poppins:wght@200;300;400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <ul class="circles" id="circles"></ul>

    <div class="wrapper">
        <div class="box">
            <div class="profile-img"> <img alt="Profile Picture"></div>

            <h2 id="profile-name"><span id="profile-location"></span></h2>

            <p class="bio">ISTQB certified QA Engineer at Corzent, based in Sri Lanka. Building side projects — always open to collab on open-source.</p>

            <div class="socials">
                <div class="a1"><a href="#" aria-label="LinkedIn"><i class="fa fa-linkedin"></i></a></div>
                <div class="a5"><a aria-label="GitHub"><i class="fa fa-github"></i></a></div>
                <div class="a6"><a aria-label="Instagram"><i class="fa fa-instagram"></i></a></div>
                <div class="a7"><a aria-label="Dev.to"><i class="fa fa-code"></i></a></div>
            </div>
        </div>
    </div>

    <script>
        // Populate profile data from data.js
        document.getElementById('profile-name').innerHTML = profileData.name + ' <span>' + profileData.location + '</span>';
        document.querySelector('.profile-img img').src = profileData.profileImage;
        
        // Social links
        document.querySelector('.a5 a').href = profileData.socialLinks.github;
        document.querySelector('.a6 a').href = profileData.socialLinks.instagram;
        document.querySelector('.a7 a').href = profileData.socialLinks.devTo;
        document.querySelector('.a1 a').addEventListener('click', function(e) {
            e.preventDefault();
            window.open(profileData.socialLinks.linkedin, '_blank', 'noopener,noreferrer');
        });
    </script>
</body>
</html>
